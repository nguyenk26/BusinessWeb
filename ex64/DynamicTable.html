<html>
    <head>
        <title>Bai 64 - Dynamic Table</title>
        <style>
            .container {
                width: 320px;
                border: 1px solid black;
                padding: 5px;
                font-family: "Times New Roman";
                font-size: 12px;
            }
            #clock {
                margin-bottom: 10px;
            }
            #tbDynamic {
                border-collapse: collapse;
                width: 270px;
            }
            #tbDynamic td {
                border: 1px solid #aaa;
                padding: 1px;
                cursor: pointer;
            }
            #tbDynamic tr {
                background-color: white;
            }
            button {
                font-size: 11px;
                margin-right: 2px;
            }
            .buttons {
                margin-top: 20px;
            }
        </style>
        <script>
            // Hien thi gio phut giay
            function showTime() {
                var now = new Date();

                var hour = now.getHours();
                var minute = now.getMinutes();
                var second = now.getSeconds();
                if (hour < 10) {
                    hour = "0" + hour;
                }
                if (minute < 10) {
                    minute = "0" + minute;
                }
                if (second < 10) {
                    second = "0" + second;
                }
                document.getElementById("clock").innerHTML =
                    hour + ":" + minute + ":" + second;
            }
            // Xu ly khi nhan chuot vao dong
            function selectRow(tr) {
                var rows = document.getElementById("tbDynamic").rows;
                // Neu dong dang mau do thi bo mau do
                if (tr.style.backgroundColor == "red") {
                    tr.style.backgroundColor = "white";
                } else {
                    tr.style.backgroundColor = "red";
                }
            }
            // Thong bao khi click chuot
            function mouseClick(event) {
                if (event.button == 2) {
                    alert("Bạn vừa nhấp chuột phải!");
                } else if (event.button == 0) {
                    alert("Bạn vừa nhấp chuột trái!");
                }
            }
            // Them dong moi vao Table
            function addRow() {
                var tbody = document.getElementById("tbDynamic");
                var tr = document.createElement("tr");
                var td1 = document.createElement("td");
                var td2 = document.createElement("td");
                td1.innerHTML = "Thêm dòng mới ở đây";
                td2.innerHTML = "Thêm dòng mới ở đây";
                tr.appendChild(td1);
                tr.appendChild(td2);
                tbody.appendChild(tr);
                // Gan su kien cho dong moi
                setRowEvents(tr);
            }
            // Gan su kien cho tung dong
            function setRowEvents(tr) {
                tr.onclick = function(event) {
                    // Neu bam vao dong thi chon dong
                    selectRow(tr);
                    // Neu bam vao o thi chon cot tuong ung
                    var td = event.target;
                    if (td.tagName == "TD") {
                        selectedColumn = td.cellIndex;
                    }
                    mouseClick(event);
                };
                tr.oncontextmenu = function(event) {
                    event.preventDefault();
                    alert("Bạn vừa nhấn chuột phải!");
                    return false;
                };
            }
            // Gan su kien cho cac dong ban dau
            function loadTable() {
                var rows = document.getElementById("tbDynamic").rows;
                for (var i = 0; i < rows.length; i++) {
                    setRowEvents(rows[i]);
                }
                showTime();
                setInterval(showTime, 1000);
            }
            // Tim dong dang duoc to do
            function getSelectedRow() {
                var rows = document.getElementById("tbDynamic").rows;
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].style.backgroundColor == "red") {
                        return rows[i];
                    }
                }
                return null;
            }
            // Xoa dong dang duoc to do
            function deleteRow() {
                var tr = getSelectedRow();
                if (tr == null) {
                    alert("Vui lòng chọn dòng cần xóa!");
                    return;
                }
                tr.remove();
            }
            // Chi hien thi dong duoc chon
            function showOnlyRow() {
                var tbody = document.getElementById("tbDynamic");
                var rows = tbody.rows;
                var selected = getSelectedRow();
                if (selected == null) {
                    alert("Vui lòng chọn dòng cần hiển thị!");
                    return;
                }
                // Neu da an cac dong khac thi hien lai tat ca
                var hidden = false;
                for (var i = 0; i < rows.length; i++) {
                    if (rows[i].style.display == "none") {
                        hidden = true;
                        break;
                    }
                }
                if (hidden) {
                    for (var i = 0; i < rows.length; i++) {
                        rows[i].style.display = "";
                    }
                } else {
                    for (var i = 0; i < rows.length; i++) {
                        if (rows[i] != selected) {
                            rows[i].style.display = "none";
                        }
                    }
                }
            }
            // Chi hien thi cot duoc chon
            var selectedColumn = -1;
            function showOnlyColumn() {
                var table = document.getElementById("tbDynamic");
                var rows = table.rows;
                if (selectedColumn == -1) {
                    alert("Vui lòng nhấn vào một ô trong cột cần hiển thị!");
                    return;
                }
                // Kiem tra co cot dang bi an khong
                var hidden = false;
                for (var i = 0; i < rows.length; i++) {
                    for (var j = 0; j < rows[i].cells.length; j++) {
                        if (rows[i].cells[j].style.display == "none") {
                            hidden = true;
                        }
                    }
                }
                // Neu cot dang bi an thi hien lai tat ca
                if (hidden) {
                    for (var i = 0; i < rows.length; i++) {
                        for (var j = 0; j < rows[i].cells.length; j++) {
                            rows[i].cells[j].style.display = "";
                        }
                    }
                } else {
                    // Chi hien thi cot duoc chon
                    for (var i = 0; i < rows.length; i++) {
                        for (var j = 0; j < rows[i].cells.length; j++) {
                            if (j != selectedColumn) {
                                rows[i].cells[j].style.display = "none";
                            }
                        }
                    }
                }
            }
            // Mo website trong tab moi
            function openWebsite() {
                window.open("https://tranduythanh.com/", "_blank");
            }
        </script>
    </head>
    <body onload="loadTable()">
        <div id="clock"></div>
        <p>
            Click chuột vào dòng này. Sẽ xuất hiện thông báo phím bấm của chuột
        </p>
        <table id="tbDynamic">
            <tbody>
                <tr>
                    <td>Thêm dòng mới ở đây</td>
                    <td>Thêm dòng mới ở đây</td>
                </tr>
                <tr>
                    <td>Thêm dòng mới ở đây</td>
                    <td>Thêm dòng mới ở đây</td>
                </tr>
                <tr>
                    <td>Thêm dòng mới ở đây</td>
                    <td>Thêm dòng mới ở đây</td>
                </tr>
                <tr>
                    <td>Dòng 1 cột 1</td>
                    <td>Dòng 1 cột 2</td>
                </tr>
                <tr>
                    <td>Dòng 2 cột 1</td>
                    <td>Dòng 2 cột 2</td>
                </tr>
                <tr>
                    <td>Dòng 3 cột 1</td>
                    <td>Dòng 3 cột 2</td>
                </tr>
            </tbody>
        </table>
        <div class="buttons">
            <button onclick="addRow()">Thêm vào</button>
            <button onclick="deleteRow()">Xóa</button>
            <button onclick="showOnlyRow()">Chỉ hiện dòng</button>
            <button onclick="showOnlyColumn()">Chỉ hiện cột</button>
            <button onclick="openWebsite()">Mở một trang mới</button>
        </div>
    </body>
</html>
